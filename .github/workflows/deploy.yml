name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          cd "心解/h5-preview"
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        run: |
          cd "心解/h5-preview/dist"
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "deploy: $(git rev-parse --short HEAD)"
          git push -f https://${{ secrets.GITHUB_TOKEN }}@github.com/shenre-0215/xinjie-app.git HEAD:gh-pages
