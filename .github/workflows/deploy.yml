name: Deploy H5 to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 心解

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup src directory
        run: |
          mkdir -p src
          cp ../manifest.json src/manifest.json
          cp ../pages.json src/pages.json
          cp ../main.js src/main.js
          cp ../App.vue src/App.vue
          cp -r ../pages src/pages
          cp -r ../store src/store
          cp -r ../components src/components
          cp -r ../utils src/utils
          cp -r ../mock src/mock
          cp -r ../styles src/styles
          ls -R src/ | head -30

      - name: Install dependencies
        run: npm install

      - name: Build H5
        run: npm run build:h5

      - name: List build output
        run: find dist -type f | sort && echo "---" && du -sh dist/assets/*.js 2>/dev/null || echo "no assets"

      - name: Fix paths for GitHub Pages
        run: node ../scripts/fix-paths.js || echo "fix-paths skipped"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 心解/dist/build/h5
          publish_branch: gh-pages
          force_orphan: true
