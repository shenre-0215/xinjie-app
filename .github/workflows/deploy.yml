name: Deploy H5 to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 心解

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup src symlinks
        run: |
          mkdir -p src
          ln -sf ../manifest.json src/manifest.json
          ln -sf ../pages.json src/pages.json
          ln -sf ../main.js src/main.js
          ln -sf ../App.vue src/App.vue
          ln -sf ../pages src/pages
          ln -sf ../store src/store
          ln -sf ../components src/components
          ln -sf ../utils src/utils
          ln -sf ../mock src/mock
          ln -sf ../styles src/styles

      - name: Install dependencies
        run: npm ci

      - name: Build H5
        run: npm run build:h5

      - name: Fix paths for GitHub Pages
        run: node ../scripts/fix-paths.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 心解/dist
          publish_branch: gh-pages
          force_orphan: true
