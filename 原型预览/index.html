    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', -apple-system, sans-serif;
      background: #f9faf6;
      color: #1a1c1a;
      min-height: 100vh;
      padding: 40px 24px;

    h1 {

      margin-bottom: 32px;
    }
    .grid {

      flex-direction: column;
      gap: 12px;
      max-width: 480px;
    }
    a.card {
      display: flex;

      gap: 16px;
      padding: 18px 20px;
      background: #ffffff;
      border-radius: 16px;
      text-decoration: none;
      color: #1a1c1a;
      box-shadow: 0 2px 12px rgba(168,213,186,0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.card:hover, a.card:active {
      transform: scale(0.98);
      box-shadow: 0 4px 20px rgba(168,213,186,0.2);
    }
    .card-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(168,213,186,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #3d6751;
      flex-shrink: 0;
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
    }
    .card-tab {
      font-size: 12px;
      color: #717973;
      margin-top: 2px;
    }
    .card-arrow {
      color: #a8d5ba;
      font-size: 18px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #717973;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 16px 0 8px;
