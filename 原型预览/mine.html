<script>
    // Micro-interaction for cards on press
    document.querySelectorAll('.active\\:bg-surface-container-low').forEach(item => {
        item.addEventListener('touchstart', () => {
            item.style.transform = 'scale(0.99)';
        });
        item.addEventListener('touchend', () => {
            item.style.transform = 'scale(1)';
        });
    });

    // Atmospheric effect: Subtle float for background circles
    const circles = document.querySelectorAll('.blur-3xl, .blur-2xl');
    let tick = 0;
    function animate() {
        tick += 0.02;
        circles.forEach((circle, i) => {
            const offset = Math.sin(tick + i) * 10;
            circle.style.transform = `translateY(${offset}px)`;
        });
        requestAnimationFrame(animate);
    }
    animate();
</script>
