<script>
        // Simple micro-interaction for swiping (visual demonstration)
        document.querySelectorAll('.swipe-container').forEach(item => {
            let startX = 0;
            let currentX = 0;
            let isSwiping = false;

            item.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
                isSwiping = true;
            }, {passive: true});

            item.addEventListener('touchmove', e => {
                if (!isSwiping) return;
                currentX = e.touches[0].clientX;
                const diff = startX - currentX;
                if (diff > 0 && diff < 100) {
                    item.style.transform = `translateX(-${diff}px)`;
                }
            }, {passive: true});

            item.addEventListener('touchend', e => {
                isSwiping = false;
                const diff = startX - currentX;
                if (diff > 50) {
                    item.style.transform = 'translateX(-96px)';
                } else {
                    item.style.transform = 'translateX(0)';
                }
            });
        });

        // Function to toggle empty state for testing
        function toggleEmptyState(isEmpty) {
            const list = document.getElementById('chat-list');
            const empty = document.getElementById('empty-state');
            if (isEmpty) {
                list.classList.add('hidden');
                empty.classList.remove('hidden');
            } else {
                list.classList.remove('hidden');
                empty.classList.add('hidden');
            }
        }

        // Logic check: The active tab is "Xin Wang" (History/Community context) 
        // as per the prompt's focus on "History Companion" which maps closely to the Hub icon in this system.
    </script>
