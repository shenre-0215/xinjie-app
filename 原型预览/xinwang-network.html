<!-- Interactive Layer: Floating Sparkles Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvasSection = document.querySelector('section.relative');
            
            canvasSection.addEventListener('click', (e) => {
                const rect = canvasSection.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                createSparkle(x, y, canvasSection);
            });

            function createSparkle(x, y, parent) {
                const sparkle = document.createElement('div');
                sparkle.className = 'absolute pointer-events-none w-4 h-4 rounded-full bg-primary-container/60 blur-[4px]';
                sparkle.style.left = `${x}px`;
                sparkle.style.top = `${y}px`;
                parent.appendChild(sparkle);

                const animation = sparkle.animate([
                    { transform: 'scale(0) translateY(0)', opacity: 1 },
                    { transform: 'scale(2.5) translateY(-40px)', opacity: 0 }
                ], {
                    duration: 1200,
                    easing: 'ease-out'
                });

                animation.onfinish = () => sparkle.remove();
            }
        });
    </script>
