<body class="font-body-md text-on-surface antialiased overflow-hidden h-screen flex flex-col">
<!-- Back to index -->
<div style="position:fixed;top:10px;left:10px;z-index:9999;background:rgba(255,255,255,0.9);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.12);">
  <a href="index.html" style="text-decoration:none;font-size:20px;color:#3d6751;" title="返回列表">☰</a>
</div>

<!-- Top Navigation Bar -->
<header class="flex items-center justify-between px-page-margin h-20 w-full bg-transparent z-50">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-lowest/50 text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface/80">记录当下</h1>
<button class="font-label-md text-label-md text-primary bg-primary-container/20 px-5 py-2 rounded-full active:opacity-70 transition-opacity">
            保存
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-page-margin pt-4 pb-32">
<div class="relative w-full h-full flex flex-col">
<!-- Date & Time Display -->
<div class="mb-6 opacity-40">
<p class="font-label-md text-label-md">2024年5月20日 · 周一 · 14:30</p>
</div>
<!-- Text Input Area -->
<textarea autofocus="" class="flex-1 w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/40 resize-none custom-caret leading-relaxed" placeholder="此刻的心情是..."></textarea>
</div>
</main>
<!-- Floating Atmosphere Elements (Background Decor) -->
<div class="fixed top-1/4 -left-12 w-64 h-64 bg-primary-container/10 blur-[80px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-12 w-48 h-48 bg-secondary-container/15 blur-[60px] rounded-full pointer-events-none"></div>
<!-- Bottom Action Bar (Fixed but appears floating) -->
<div class="fixed bottom-0 left-0 w-full px-page-margin pb-10 z-50">
<div class="bg-surface-container-lowest/90 backdrop-blur-md rounded-lg p-6 healing-shadow flex flex-col gap-6">
<!-- Tags Selection -->
<div class="flex flex-wrap gap-inline-gap">
<button class="flex items-center gap-1 px-4 py-1.5 bg-surface-container-low rounded-full text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">add</span>
<span class="font-label-md text-label-md">添加标签</span>
</button>
<div class="px-4 py-1.5 bg-secondary-container/30 text-on-secondary-container rounded-full font-label-md text-label-md">
                    # 宁静
                </div>
</div>
<!-- Interaction Row -->
<div class="flex items-center justify-between gap-4">
<!-- Mood Emojis -->
<div class="flex gap-4">
<div class="mood-item cursor-pointer flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-[#fceec7] flex items-center justify-center mb-1 shadow-sm">
<span class="material-symbols-outlined text-[#d4a017] group-hover:scale-110 transition-transform" data-weight="fill">sentiment_very_satisfied</span>
</div>
</div>
<div class="mood-item cursor-pointer flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-primary-container/30 flex items-center justify-center mb-1 border-2 border-primary-container/50">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-weight="fill">sentiment_satisfied</span>
</div>
</div>
<div class="mood-item cursor-pointer flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mb-1 opacity-60">
<span class="material-symbols-outlined text-on-surface-variant group-hover:scale-110 transition-transform">sentiment_neutral</span>
</div>
</div>
<div class="mood-item cursor-pointer flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-tertiary-container/30 flex items-center justify-center mb-1 opacity-60">
<span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform">sentiment_dissatisfied</span>
</div>
</div>
<div class="mood-item cursor-pointer flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-error-container/20 flex items-center justify-center mb-1 opacity-60">
<span class="material-symbols-outlined text-error/60 group-hover:scale-110 transition-transform">sentiment_very_dissatisfied</span>
</div>
</div>
</div>
<!-- Media Buttons -->
<div class="flex items-center gap-4">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[24px]">image</span>
</button>
<button class="w-14 h-14 flex items-center justify-center rounded-full bg-primary text-white shadow-lg active:scale-90 transition-all flex-shrink-0" id="mic-btn">
<span class="material-symbols-outlined text-[28px]">mic</span>
</button>
</div>
</div>
</div>
</div>
<!-- Voice Recording Interaction Layer (Hidden by default) -->
<div class="fixed inset-0 bg-white/40 backdrop-blur-xl z-[60] flex flex-col items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none" id="voice-overlay">
<div class="w-32 h-32 bg-primary/10 rounded-full flex items-center justify-center relative">
<div class="absolute inset-0 bg-primary/20 rounded-full animate-ping"></div>
<span class="material-symbols-outlined text-primary text-[48px]">mic</span>
</div>
<p class="mt-8 font-headline-sm text-headline-sm text-primary">聆听中...</p>
<p class="mt-2 text-on-surface-variant font-body-md">向上滑动取消，松开结束</p>
</div>
<script>
        // Mic Button Micro-interaction
        const micBtn = document.getElementById('mic-btn');
        const voiceOverlay = document.getElementById('voice-overlay');
        let timer;

        micBtn.addEventListener('mousedown', () => {
            timer = setTimeout(() => {
                voiceOverlay.classList.remove('opacity-0', 'pointer-events-none');
            }, 200);
        });

        const stopRecording = () => {
            clearTimeout(timer);
            voiceOverlay.classList.add('opacity-0', 'pointer-events-none');
        };

        window.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            timer = setTimeout(() => {
                voiceOverlay.classList.remove('opacity-0', 'pointer-events-none');
            }, 200);
        });
        micBtn.addEventListener('touchend', stopRecording);

        // Mood selection feedback
        const moodItems = document.querySelectorAll('.mood-item');
        moodItems.forEach(item => {
            item.addEventListener('click', () => {
                moodItems.forEach(i => {
                    i.querySelector('div').classList.remove('border-2', 'border-primary-container/50', 'opacity-100');
                    i.querySelector('div').classList.add('opacity-60');
                });
                item.querySelector('div').classList.remove('opacity-60');
                item.querySelector('div').classList.add('border-2', 'border-primary-container/50', 'opacity-100');
            });
        });
    </script>
