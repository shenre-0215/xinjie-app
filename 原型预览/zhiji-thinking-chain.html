<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e2e3df",
                        "secondary-fixed-dim": "#d3c6a0",
                        "on-primary-fixed-variant": "#254f3a",
                        "surface-dim": "#d9dad7",
                        "surface-bright": "#f9faf6",
                        "surface": "#f9faf6",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e3df",
                        "on-error": "#ffffff",
                        "primary-fixed": "#bfedd1",
                        "secondary-fixed": "#efe2bb",
                        "tertiary-container": "#e0c3cf",
                        "primary-container": "#a8d5ba",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#4f4629",
                        "primary-fixed-dim": "#a4d1b6",
                        "on-primary-container": "#345d48",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f4f0",
                        "surface-container-high": "#e8e8e5",
                        "primary": "#3d6751",
                        "on-tertiary-fixed-variant": "#56414b",
                        "on-surface-variant": "#414943",
                        "surface-container": "#edeeeb",
                        "on-surface": "#1a1c1a",
                        "on-secondary": "#ffffff",
                        "on-background": "#1a1c1a",
                        "tertiary": "#6f5862",
                        "outline-variant": "#c1c8c1",
                        "on-secondary-fixed": "#211b04",
                        "secondary-container": "#eddfb8",
                        "on-secondary-container": "#6c6243",
                        "on-tertiary-fixed": "#27161f",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2f312f",
                        "on-tertiary-container": "#654f59",
                        "background": "#f9faf6",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#f9dbe7",
                        "surface-tint": "#3d6751",
                        "inverse-on-surface": "#f0f1ed",
                        "tertiary-fixed-dim": "#dcbfcb",
                        "inverse-primary": "#a4d1b6",
                        "secondary": "#675e3f",

                        "outline": "#717973"

                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "module-gap": "28px",
                        "page-margin": "32px",
                        "safe-bottom": "34px",
                        "safe-top": "88px",
                        "stack-gap": "16px",
                        "inline-gap": "12px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Nunito Sans"],
                        "label-sm": ["Nunito Sans"],

                        "display-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                        "label-sm": ["11px", {"lineHeight": "16px", "fontWeight": "400"}],

                        "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "headline-sm": ["18px", {"lineHeight": "26px", "fontWeight": "600"}],
                        "body-md": ["15px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #f9faf6;
            color: #1a1c1a;
            -webkit-tap-highlight-color: transparent;
        }
        .healing-shadow {
            box-shadow: 0px 4px 20px rgba(168, 213, 186, 0.12);
        }
        .step-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bg-blur-blob {
            filter: blur(60px);
            opacity: 0.4;
            z-index: -1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Back to index -->
<div style="position:fixed;top:10px;left:10px;z-index:9999;background:rgba(255,255,255,0.9);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.12);">
  <a href="index.html" style="text-decoration:none;font-size:20px;color:#3d6751;" title="返回列表">☰</a>
</div>

<!-- Decorative Background Elements -->
<div class="fixed top-[-10%] right-[-10%] w-64 h-64 bg-primary-container rounded-full bg-blur-blob"></div>
<div class="fixed bottom-[-5%] left-[-5%] w-80 h-80 bg-secondary-container rounded-full bg-blur-blob"></div>
<!-- Top Navigation Anchor (Manual Logic: Transactional screen, Hide Shell, Show Progress) -->
<header class="fixed top-0 left-0 right-0 z-40 bg-background/80 backdrop-blur-md px-page-margin pt-10 pb-4 h-auto flex flex-col items-center">
<div class="flex items-center justify-between w-full mb-6">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low active:scale-90 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">思考链编辑</h1>
<div class="w-10"></div>
</div>
<!-- Stepper: 觉察、拆解、破局、实践、复盘 -->
<div class="relative w-full flex justify-between items-center px-2">
<!-- Connector Line -->
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-surface-container-highest -translate-y-1/2 z-0"></div>
<div class="absolute top-1/2 left-0 h-[2px] bg-primary-container -translate-y-1/2 z-0 transition-all duration-500" style="width: 0%;"></div>
<!-- Nodes -->
<div class="relative z-10 flex flex-col items-center gap-2 group">
<div class="w-4 h-4 rounded-full bg-primary ring-4 ring-primary-container/30 transition-all"></div>
<span class="font-label-md text-label-md text-primary">觉察</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-2 group">
<div class="w-4 h-4 rounded-full bg-surface-container-highest transition-all"></div>
<span class="font-label-md text-label-md text-on-surface-variant/40">拆解</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-2 group">
<div class="w-4 h-4 rounded-full bg-surface-container-highest transition-all"></div>
<span class="font-label-md text-label-md text-on-surface-variant/40">破局</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-2 group">
<div class="w-4 h-4 rounded-full bg-surface-container-highest transition-all"></div>
<span class="font-label-md text-label-md text-on-surface-variant/40">实践</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-2 group">
<div class="w-4 h-4 rounded-full bg-surface-container-highest transition-all"></div>
<span class="font-label-md text-label-md text-on-surface-variant/40">复盘</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[160px] px-page-margin pb-32">
<div class="step-transition">
<!-- Step Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 healing-shadow mb-8 relative overflow-hidden">
<!-- Mascot Guide Asset -->
<div class="absolute top-4 right-4 opacity-20">
<img class="w-16 h-16 object-contain" data-alt="A minimal, cute, round green creature with tiny ears and a happy closed-eye smile, styled in a soft 2D vector aesthetic with gentle outlines. The character is set against a clean white background, conveying a sense of peace, healing, and friendly companionship." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBl3N7BXnJfCCQ1yhfa-HvgHjaXJ7Y-RhUJaFls17fiLaM8OIpBII4k27ivsR5WgejfiUDi53FePo7IdZqNjhGyfHV8tyzAeFFxxpcOwiV2IlUSxG1WFNp8VPdp99uHKo_wUzXNeaCoppAFz_8ZGE_a69TCT-Rpj9vFxuJ7kyXxEz5AuOW-VAQbtOX8m_Z_g7vafdmh5aTHdsdVwgYWmOmWZ9Ftc2O9zVdz3dvFOIKToFzYscI-8t8XWp-hSey9VSRpYdwd4MloCxkl"/>
</div>
<div class="mb-module-gap">
<span class="inline-block px-3 py-1 rounded-full bg-tertiary-container text-on-tertiary-container font-label-md text-label-md mb-3">步骤 1 / 5</span>
<h2 class="font-headline-md text-headline-md text-on-surface leading-snug">
                        此刻最强烈的感受是什么？
                    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 opacity-70">
                        闭上眼呼吸三次，试着捕捉那个在你胸口浮动的词汇。
                    </p>
</div>
<!-- Input Area -->
<div class="space-y-4">
<textarea class="w-full min-h-[180px] bg-surface-container-low border-none rounded-lg p-5 font-body-lg text-body-lg focus:ring-2 focus:ring-primary-container/50 placeholder:text-on-surface-variant/30 resize-none transition-all" placeholder="在这里写下你的真实觉察..."></textarea>
<div class="flex flex-wrap gap-2">
<span class="px-3 py-1.5 rounded-full bg-secondary-container/30 text-on-secondary-container font-label-md text-label-md active:bg-secondary-container transition-colors cursor-pointer">#焦虑</span>
<span class="px-3 py-1.5 rounded-full bg-secondary-container/30 text-on-secondary-container font-label-md text-label-md active:bg-secondary-container transition-colors cursor-pointer">#平静</span>
<span class="px-3 py-1.5 rounded-full bg-secondary-container/30 text-on-secondary-container font-label-md text-label-md active:bg-secondary-container transition-colors cursor-pointer">#有些混乱</span>
</div>
</div>
</div>
<!-- Helpful Hint Card -->
<div class="bg-primary-container/10 border border-primary-container/20 rounded-lg p-5 flex items-start gap-4">
<span class="material-symbols-outlined text-primary mt-0.5">lightbulb</span>
<div>
<h3 class="font-label-md text-label-md text-on-primary-container mb-1">小贴士</h3>
<p class="font-body-md text-body-md text-on-primary-container/80 leading-relaxed">
                        不要评判你的感受。无论是愤怒还是委屈，它们都是你当下的真实反馈。
                    </p>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar (Manual Implementation for Transactional UI) -->
<footer class="fixed bottom-0 left-0 right-0 bg-background/95 backdrop-blur-lg px-page-margin pt-4 pb-safe-bottom flex items-center justify-between h-auto z-50">
<button class="flex items-center gap-2 py-4 px-2 text-on-surface-variant font-label-md text-label-md active:opacity-60 transition-opacity">
<span class="material-symbols-outlined text-[18px]">push_pin</span>
            标记悬置
        </button>
<div class="flex items-center gap-inline-gap">
<button class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<button class="bg-primary hover:bg-primary/90 text-on-primary font-headline-sm text-headline-sm px-8 h-14 rounded-lg healing-shadow flex items-center gap-2 active:scale-98 transition-all">
                确认闭合
                <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</footer>
<script>
        // Micro-interaction: Input focus effect
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('focus', () => {
            textarea.parentElement.parentElement.classList.add('ring-2', 'ring-primary-container/20');
        });
        textarea.addEventListener('blur', () => {
            textarea.parentElement.parentElement.classList.remove('ring-2', 'ring-primary-container/20');
        });

        // Simple stepper logic for demo (only visual)
        document.querySelectorAll('.cursor-pointer').forEach(chip => {
            chip.addEventListener('click', function() {
                textarea.value += (textarea.value ? ' ' : '') + this.innerText;
                textarea.focus();
            });
        });
    </script>
</body></html>
